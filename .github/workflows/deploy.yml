# Builds the site and publishes it to GitHub Pages on every push to main.
#
# BASE_PATH is what makes this work. A GitHub *project* site is served from
# /<repo>/, so every root-relative link would 404 without it. Delete the env
# line (and set the custom domain in Settings -> Pages) once evenus.app points
# here — the same source builds both.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        env:
          BASE_PATH: /evenus-website
        run: node src/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
