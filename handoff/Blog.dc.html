<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior:smooth; }
  body { margin:0; background:#F7F5EF; color:#1B1F1D; font-family:'Plus Jakarta Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#2E6A5C; text-decoration:none; }
  a:hover { color:#1B1F1D; }
  ::selection { background:#DCEFE9; }
</style>
</helmet>

<dc-import name="SiteHeader" active="blog" hint-size="100%,66px"></dc-import>

<main style="min-height:100vh;background:#F7F5EF">
  <section style="max-width:1180px;margin:0 auto;padding:clamp(52px,7vw,96px) 28px clamp(28px,3vw,44px)">
    <div style="font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8A8F89">The blog</div>
    <h1 style="margin:16px 0 0;font-size:clamp(40px,5.4vw,68px);line-height:1.02;letter-spacing:-.035em;font-weight:700">Writing</h1>
    <p style="margin:18px 0 0;max-width:520px;font-size:17.5px;line-height:1.6;color:#5E645F;text-wrap:pretty">115 pieces on mental load, money and how households actually run.</p>
  </section>

  <section style="max-width:1180px;margin:0 auto;padding:0 28px">
    <div style="display:flex;flex-wrap:wrap;gap:9px;padding-bottom:32px;border-bottom:1px solid #E4DFD3">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.pick }}" style="font-family:inherit;font-size:13px;font-weight:600;padding:10px 18px;border-radius:99px;cursor:pointer;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.label }}</button>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1180px;margin:0 auto;padding:clamp(36px,4vw,56px) 28px clamp(64px,8vw,110px)">
    <div style="display:flex;flex-direction:column">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="8">
        <a href="{{ p.url }}" target="_blank" rel="noopener" style="display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:26px 0;border-bottom:1px solid #E9E4D8;color:#1B1F1D;text-decoration:none" style-hover="background:#FBFAF6">
          <div style="display:flex;align-items:center;gap:12px">
            <span style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2E6A5C;background:#E7F2EE;border:1px solid #CFE6DE;padding:5px 10px;border-radius:99px">{{ p.cat }}</span>
            <span style="font-size:12.5px;color:#A9AEA8">{{ p.read }}</span>
          </div>
          <div style="font-size:clamp(19px,2.1vw,25px);font-weight:700;letter-spacing:-.025em;line-height:1.22;max-width:820px;text-wrap:pretty">{{ p.title }}</div>
          <div style="font-size:15px;line-height:1.6;color:#5E645F;max-width:760px;text-wrap:pretty">{{ p.excerpt }}</div>
        </a>
      </sc-for>
    </div>

    <div style="margin-top:44px;display:flex;justify-content:center">
      <a href="https://evenus.app/blog/" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:10px;border:1px solid #DAD4C6;color:#1B1F1D;font-size:14.5px;font-weight:600;padding:14px 26px;border-radius:99px;text-decoration:none" style-hover="background:#EFEBE1">Browse all 115 pieces</a>
    </div>
  </section>

  <section style="background:#1B1F1D;color:#F7F5EF">
    <div style="max-width:1180px;margin:0 auto;padding:clamp(56px,7vw,96px) 28px;text-align:center">
      <h2 style="margin:0 auto;max-width:560px;font-size:clamp(28px,3.6vw,44px);line-height:1.08;letter-spacing:-.03em;font-weight:700">Reading about it is one thing. <span style="font-family:Newsreader,serif;font-style:italic;font-weight:300;color:#8FD0BE">Measuring it</span> is another.</h2>
      <a href="EvenUS%20Website.dc.html#demo" style="display:inline-flex;margin-top:30px;background:#F7F5EF;color:#1B1F1D;font-size:15px;font-weight:600;padding:15px 28px;border-radius:99px;text-decoration:none" style-hover="background:#8FD0BE">Try the calculation</a>
    </div>
  </section>
</main>

<dc-import name="SiteFooter" hint-size="100%,140px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const POSTS = [
  ["Mental load", "What is the Mental Load? Why You're Tired Even When You're \u201cOff.\u201d", "The house is clean, the kids are asleep, and you still cannot switch off. A look at the work that has no start or finish.", "what-is-the-mental-load", "9 min"],
  ["Mental load", "7 Signs You're Carrying the Majority of the Mental Load", "On the surface you have both \u201cdone your bit\u201d. Underneath, one of you is still running the household in their head.", "7-signs-carrying-mental-load", "7 min"],
  ["Mental load", "How to Explain the Mental Load to a Partner Who Doesn't \u201cSee\u201d It", "Being exhausted and unable to point at the reason is one of the most isolating experiences in a relationship.", "how-to-explain-the-mental-load-to-a-partner", "11 min"],
  ["Mental load", "Cognitive Labor vs. Physical Chores: Why Both Need to Be Tracked", "\u201cI did the dishes\u201d and \u201cI knew the dishes needed doing\u201d are not the same contribution.", "cognitive-labor-vs-physical-chores", "8 min"],
  ["Mental load", "The Invisible Labor Checklist: 25 Tasks You're Doing Without Realizing It", "Household responsibility works like an iceberg. This is what sits under the waterline.", "invisible-labor-checklist", "10 min"],

  ["Mental load", "The Silent Resentment: Healing from Unshared Invisible Work", "One partner is asleep. The other is awake, replaying the day. Resentment is rarely a collapse — it is a slow leak.", "the-silent-resentment", "12 min"],
  ["Money", "Why \u201cFair\u201d Doesn't Always Mean \u201cEqual\u201d in Housework", "For a generation the 50/50 split has been the goal. It quietly punishes whoever earns less.", "why-fair-doesnt-always-mean-equal", "10 min"],
  ["Money", "Income Proportional Bill Splitting: The Fair Way to Manage Money", "What proportional splitting actually does to a household budget, with the arithmetic shown.", "income-proportional-bill-splitting", "9 min"],
  ["Money", "The Equity Shift: How to Split Finances When Incomes Differ", "The 50/50 split is the default starting point for most couples moving in together. It is rarely where they end up.", "how-to-split-finances-when-incomes-differ", "11 min"],
  ["Money", "50/50 vs. Proportional: Which Rent Splitting Method is Actually Fair?", "Clean, simple, and a sign of modern equality — until one salary changes.", "rent-splitting-method", "8 min"],
  ["Money", "How to Manage Household Finances Without a Joint Bank Account", "Virtual equity for couples who keep their money separate and still want a fair split.", "manage-household-finances-without-a-joint-bank-account", "10 min"],
  ["Money", "Financial Transparency: Building Trust and Fairness Together", "Trust is the first word spoken about a partnership, and the last thing most couples apply to money.", "financial-transparency", "9 min"],
  ["Money", "5 Red Flags in Couple Finances You Should Never Ignore", "One partner mentions new work clothes. The other freezes. What that moment is really about.", "red-flags-in-couple-finances", "7 min"],
  ["Money", "Managing Debt as a Couple: Student Loans and Credit Cards", "Debt is rarely a line item. It is a silent partner in every major decision.", "managing-debt-as-a-couple", "11 min"],
  ["Using EvenUS", "How the EvenUS Fairness Score Really Works", "A single number on the screen. Here is exactly what goes into it — effort, money and mental load.", "how-the-evenus-fairness-score-really-works-effort-money-mental-load-explained", "8 min"],
  ["Using EvenUS", "Complete Step-by-Step: Set Up EvenUS With Your Partner in Under 60 Seconds", "Both accounts, one household, one code. The whole setup.", "complete-step-by-step", "5 min"],
  ["Using EvenUS", "How to Track Mental Load Effectively in EvenUS", "\u201cWhat did you do today?\u201d The honest answer is usually planning. Here is how to log it.", "how-to-track-mental-load", "7 min"],
  ["Using EvenUS", "Income-Aware Splits: Exactly How It Calculates Fair Shares", "Rent is due in two days. This is the calculation running behind the number you see.", "income-aware-splits-heres-exactly-how-it-calculates-fair-shares", "9 min"],
  ["Using EvenUS", "How to Read & Improve Your Weekly Fairness Report", "What the numbers actually mean, and which ones are worth reacting to.", "weekly-fairness-report", "8 min"],
  ["Using EvenUS", "Your First 30 Days With EvenUS — What to Expect", "You have tried chore charts before. This is what the first month usually looks like.", "your-first-30-days-with-evenus", "10 min"],
  ["Using EvenUS", "Gentle Reminders: Smart Help That Feels Like Love, Not Nagging", "Reminders belong to a task, not a person. Why that distinction is the whole design.", "gentle-reminders", "6 min"],
  ["Life changes", "Pregnancy & Postpartum: Protecting Mental Load Balance in the First Year", "The load gets heavier than the bump long before the baby arrives.", "pregnancy-postpartum", "12 min"],
  ["Life changes", "How to Rebalance After a Job Loss, Promotion, or Relocation", "Household income jumps 40%, or disappears. The split has to move with it.", "household-equity-after-a-job-loss", "9 min"],
  ["Life changes", "Household Management When One Partner Has a Chronic Illness", "One day you split chores evenly. The next, a flare-up hits. Building a system that flexes.", "household-management-when-one-partner-has-a-chronic-illness", "11 min"],
  ["Life changes", "ADHD & Autism in Couples: Building a Custom Equity System", "One partner hyperfocuses for twelve hours. The other cannot start the dishwasher. Both are real.", "adhd-autism-in-couples", "13 min"],
  ["Life changes", "Empty Nesters: Redefining Roles When Kids Leave Home", "The house goes quiet and the chore list stops making sense.", "empty-nesters", "8 min"],
  ["Life changes", "Cross Cultural Couples: Merging Different Expectations", "Two households of origin, two sets of unspoken defaults, one kitchen.", "cross-cultural-couples", "10 min"],
  ["Reviews", "EvenUS vs Honeydue vs Flatastic — The Honest 2026 Comparison", "Joint banking, chore lists, and the thing neither of them measures.", "evenus-vs-honeydue-vs-flatastic", "12 min"],
  ["Reviews", "Best Chore Tracking Apps for Android and iOS (2026)", "Seven apps, tested against a real household for a month.", "best-chore-tracking-apps", "14 min"],
  ["Reviews", "The Fair Play System vs. Digital Apps", "A card deck built a movement. Where it works, and where software does better.", "the-fair-play-system-vs-digital-apps", "10 min"],
  ["Reviews", "EvenUS vs Traditional Spreadsheets: Why We Built a Better Way", "One partner relaxing, the other hunched over a shared sheet at 8pm. The spreadsheet is the problem.", "evenus-vs-traditional-spreadsheets", "8 min"]
];

class Component extends DCLogic {
  state = { cat: "All" };

  renderVals() {
    const names = ["All", "Mental load", "Money", "Using EvenUS", "Life changes", "Reviews"];
    const cur = this.state.cat;
    return {
      cats: names.map(label => {
        const on = label === cur;
        return {
          label,
          bg: on ? "#1B1F1D" : "transparent",
          fg: on ? "#F7F5EF" : "#5E645F",
          border: on ? "#1B1F1D" : "#DAD4C6",
          pick: () => this.setState({ cat: label })
        };
      }),
      posts: POSTS.filter(p => cur === "All" || p[0] === cur).map(p => ({
        cat: p[0], title: p[1], excerpt: p[2], read: p[4],
        url: "https://evenus.app/blog/" + p[3] + "/"
      }))
    };
  }
}
</script>
</body>
</html>
