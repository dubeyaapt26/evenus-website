<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(247,245,239,.85);border-bottom:1px solid rgba(228,223,211,.9);font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div style="max-width:1180px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="EvenUS%20Website.dc.html" style="font-size:22px;font-weight:700;letter-spacing:-.02em;color:#1B1F1D;text-decoration:none">Even<span style="font-family:Newsreader,serif;font-style:italic;font-weight:400;color:#2E6A5C">US</span></a>
    <nav style="display:flex;align-items:center;gap:30px;font-size:14px;font-weight:500">
      <a href="EvenUS%20Website.dc.html" style="text-decoration:none;color:{{ cHome }}">Home</a>
      <a href="Blog.dc.html" style="text-decoration:none;color:{{ cBlog }}">Blog</a>
      <a href="Help.dc.html" style="text-decoration:none;color:{{ cHelp }}">Help</a>
    </nav>
    <a href="EvenUS%20Website.dc.html#get" style="display:inline-flex;align-items:center;background:#1B1F1D;color:#F7F5EF;font-size:14px;font-weight:600;padding:11px 20px;border-radius:99px;white-space:nowrap;text-decoration:none" style-hover="background:#2E6A5C">Get the app</a>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;blog&quot;,&quot;help&quot;,&quot;&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "";
    const on = "#1B1F1D", off = "#5E645F";
    return { cHome: a === "home" ? on : off, cBlog: a === "blog" ? on : off, cHelp: a === "help" ? on : off };
  }
}
</script>
</body>
</html>
